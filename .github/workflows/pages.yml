name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm -C oracle build
      - run: pnpm -C sdk build
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: future
      # sdk/contracts/go.mod reads executor's template engine from a sibling checkout
      - uses: actions/checkout@v4
        with:
          repository: arkade-os/executor
          path: executor
      - uses: actions/setup-go@v5
        with:
          go-version-file: future/sdk/contracts/go.mod
          cache-dependency-path: future/sdk/contracts/go.sum
      - run: go test ./...
        working-directory: future/sdk/contracts

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app, contracts]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
